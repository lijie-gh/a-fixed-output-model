<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行记 · Pelican Ride</title>
<style>
  :root{--accent:#e63946;--accent-text:#fff}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--text);
    transition:color .9s;
  }
  /* 页面环境光：跟随场景淡入淡出 */
  .bgs{position:fixed;inset:0;z-index:-1}
  .bg{position:absolute;inset:0;opacity:0;transition:opacity .9s}
  .bg.on{opacity:1}
  .bg-day{background:linear-gradient(160deg,#bfe7ff,#eafaf0 60%,#dff3d8)}
  .bg-sunset{background:linear-gradient(160deg,#33204a,#a34a68 55%,#eb9a5e)}
  .bg-night{background:linear-gradient(160deg,#04081c,#101f42 55%,#1b2f57)}
  .bg-sea{background:linear-gradient(160deg,#b7e5ff,#e6f8ff 55%,#f6ecd2)}
  .bg-rain{background:linear-gradient(160deg,#93a7b8,#c2cfd8 55%,#aebfc2)}

  body[data-theme=day]{--text:#2b3a45;--muted:#5b6b7a;--subtle:#8aa0ae;
    --accent:#e63946;--accent-text:#fff;--accent-h:#d02f3c;
    --card:#ffffff;--card-edge:rgba(255,255,255,.6);--shadow:0 18px 50px rgba(30,60,90,.18);
    --chip:#ffffff;--chip-edge:#e3e8ee;--chip-hover-edge:#e63946;--track:#e3e8ee;--svgbase:#8fd3f4}
  body[data-theme=sunset]{--text:#4a3040;--muted:#8a6156;--subtle:#b18f7e;
    --accent:#e8622c;--accent-text:#fff;--accent-h:#d5541f;
    --card:#fff2e3;--card-edge:#ffdcb8;--shadow:0 18px 50px rgba(70,30,60,.35);
    --chip:#ffe7cf;--chip-edge:#f2c9a4;--chip-hover-edge:#e8622c;--track:#f0d2b4;--svgbase:#7b3a63}
  body[data-theme=night]{--text:#dce6ff;--muted:#93a5d6;--subtle:#66759f;
    --accent:#ffd66b;--accent-text:#182348;--accent-h:#ffca45;
    --card:#182348;--card-edge:#2c3d6e;--shadow:0 18px 50px rgba(0,0,10,.55);
    --chip:#223058;--chip-edge:#35477c;--chip-hover-edge:#ffd66b;--track:#35477c;--svgbase:#0a1638}
  body[data-theme=sea]{--text:#1e3a4a;--muted:#55788a;--subtle:#8ab0c0;
    --accent:#0e8fc4;--accent-text:#fff;--accent-h:#0c7dae;
    --card:#ffffff;--card-edge:rgba(255,255,255,.6);--shadow:0 18px 50px rgba(20,90,130,.22);
    --chip:#f2fbff;--chip-edge:#cfe8f2;--chip-hover-edge:#0e8fc4;--track:#d3ecf5;--svgbase:#7ec8f0}
  body[data-theme=rain]{--text:#33424e;--muted:#64788a;--subtle:#93a6b4;
    --accent:#476f8f;--accent-text:#fff;--accent-h:#3b607d;
    --card:#f4f8fa;--card-edge:#dfe8ee;--shadow:0 18px 50px rgba(40,60,80,.28);
    --chip:#eaf1f5;--chip-edge:#ccd8e0;--chip-hover-edge:#476f8f;--track:#d5e1e8;--svgbase:#97a8b5}

  .card{
    width:min(1060px,96vw);background:var(--card);border:1px solid var(--card-edge);
    border-radius:22px;box-shadow:var(--shadow);padding:20px 24px 16px;
    transition:background-color .9s,border-color .9s,box-shadow .9s;
  }
  h1{margin:0 0 2px;font-size:26px;color:var(--text);transition:color .9s}
  h1 small{font-size:14px;color:var(--subtle);font-weight:500;margin-left:8px;transition:color .9s}
  .sub{margin:0 0 10px;color:var(--muted);font-size:14px;transition:color .9s}
  .sceneBar{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
  .sceneBar button{
    padding:6px 14px;border:2px solid var(--chip-edge);border-radius:999px;background:var(--chip);
    cursor:pointer;font-size:14px;font-family:inherit;color:var(--text);
    transition:background-color .5s,border-color .5s,color .5s,transform .15s;
  }
  .sceneBar button:hover{border-color:var(--chip-hover-edge);transform:translateY(-1px)}
  .sceneBar button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .sceneBar .langBtn{margin-left:auto;font-weight:700;letter-spacing:.5px}
  .controls{display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap;font-size:14px}
  .controls button{
    padding:6px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-text);
    font-size:14px;cursor:pointer;font-family:inherit;transition:background-color .5s,color .5s;
  }
  .controls button:hover{background:var(--accent-h)}
  .controls input[type=range]{
    -webkit-appearance:none;appearance:none;width:180px;height:6px;border-radius:3px;
    background:var(--track);outline:none;vertical-align:middle;transition:background-color .5s;
  }
  .controls input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.3);
    cursor:pointer;transition:background-color .5s,border-color .5s;
  }
  .controls input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:var(--accent);
    border:3px solid var(--card);cursor:pointer;
  }
  #speedVal{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;min-width:52px;transition:color .9s}
  /* 语言切换时的宽度平滑过渡 */
  .fit{box-sizing:border-box;overflow:hidden;white-space:nowrap;transition:width .32s cubic-bezier(.4,0,.2,1)}
  .h1fit{display:inline-block;vertical-align:bottom}
  svg{display:block;width:100%;height:auto;border-radius:14px;background:var(--svgbase);transition:background-color .9s}
  svg text{font-family:"Microsoft YaHei",system-ui,sans-serif}
  #bubble{opacity:0;transition:opacity .25s}
  #bubble.show{opacity:1}
  .scene{opacity:0;transition:opacity .8s;pointer-events:none}
  .scene.active{opacity:1;pointer-events:auto}
  .tint{transition:opacity .8s}
  .fx{transition:opacity .8s}
  .zl{animation:zl .8s linear infinite}
  .zl2{animation-delay:.25s}.zl3{animation-delay:.5s}
  @keyframes zl{from{transform:translateX(0);opacity:.85}to{transform:translateX(-90px);opacity:0}}
  .twinkle{animation:tw 2.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
  .boatbob{animation:bb 3.2s ease-in-out infinite alternate}
  @keyframes bb{from{transform:translateY(0)}to{transform:translateY(4px)}}
</style>
</head>

    <circle cx="606" cy="380" r="8" fill="#f4c430" stroke="#8a6a10" stroke-width="2"/>
    <circle cx="606" cy="380" r="4" fill="#fff8d8"/>

    <!-- 车筐和鱼 -->
    <g>
      <path d="M606,314 L592,304 M650,314 L640,306" stroke="#666" stroke-width="3" stroke-linecap="round"/>
      <path d="M598,316 L666,316 L655,362 L609,362 Z" fill="#d29a55" stroke="#a06c30" stroke-width="3" stroke-linejoin="round"/>
      <path d="M612,312 C620,296 644,292 658,302 C650,312 626,318 612,312 Z" fill="#8fb6d4" stroke="#5b7f9e" stroke-width="2.5"/>
      <path d="M654,300 L670,292 L666,310 Z" fill="#8fb6d4" stroke="#5b7f9e" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="622" cy="305" r="2.2" fill="#22303c"/>
      <path d="M603,330 L662,330 M606,346 L659,346 M622,318 L626,360 M640,318 L642,360" stroke="#a06c30" stroke-width="2" opacity=".7" fill="none"/>
      <rect x="596" y="312" width="72" height="8" rx="4" fill="#b98443" stroke="#a06c30" stroke-width="2"/>
    </g>

    <!-- 传动 -->
    <line id="chainTop" x1="450" y1="467" x2="330" y2="461" stroke="#565d66" stroke-width="3.5" stroke-dasharray="6 5"/>
    <line id="chainBot" x1="450" y1="489" x2="330" y2="479" stroke="#565d66" stroke-width="3.5" stroke-dasharray="6 5"/>
    <circle cx="330" cy="470" r="10" fill="none" stroke="#565d66" stroke-width="3"/>
    <circle cx="450" cy="478" r="17" fill="none" stroke="#565d66" stroke-width="4"/>
    <circle cx="450" cy="478" r="9" fill="#374151"/><circle cx="450" cy="478" r="3.5" fill="#9aa3ae"/>

    <!-- 座椅 -->
    <line x1="398" y1="330" x2="394" y2="310" stroke="#374151" stroke-width="7" stroke-linecap="round"/>
    <path d="M348,304 Q348,293 366,293 L416,295 Q430,296 428,305 Q426,312 410,312 L360,312 Q348,312 348,304 Z"
          fill="#3a3f47" stroke="#23272d" stroke-width="2"/>

    <!-- 鹈鹕 -->
    <g id="pelican">
      <path d="M340,276 Q280,272 254,228 Q296,244 342,246 Z" fill="#fff" stroke="#cfd4cc" stroke-width="3" stroke-linejoin="round"/>
      <path d="M340,262 Q296,252 276,220 Q312,236 344,238 Z" fill="#fff" stroke="#cfd4cc" stroke-width="3" stroke-linejoin="round"/>
      <path d="M322,262 C316,218 352,198 394,208 C436,218 452,248 447,284 C442,318 404,338 368,332 C336,326 327,300 322,262 Z"
            fill="#ffffff" stroke="#cfd4cc" stroke-width="3"/>
      <path d="M360,300 q14,10 32,8 M348,282 q12,10 28,8" stroke="#e3e6dc" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M426,228 C430,196 448,170 480,152" fill="none" stroke="#cfd4cc" stroke-width="24" stroke-linecap="round"/>
      <path d="M426,228 C430,196 448,170 480,152" fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round"/>
      <g id="headG">
        <circle cx="490" cy="148" r="21" fill="#fff" stroke="#cfd4cc" stroke-width="3"/>
        <path d="M467,146 A24,23 0 0 1 513,146 L513,152 L467,152 Z" fill="#2f6fed" stroke="#1d4fb8" stroke-width="2" stroke-linejoin="round"/>
        <path d="M486,124 L494,124 L496,152 L486,152 Z" fill="#ffd93b"/>
        <path d="M470,152 L476,168 M510,152 L502,170" stroke="#1d4fb8" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="499" cy="144" r="3.6" fill="#2d2d2d"/><circle cx="500.5" cy="142.5" r="1.3" fill="#fff"/>
        <path d="M504,150 C508,180 536,198 570,194 C596,190 612,180 618,167 C580,152 536,146 504,150 Z"
              fill="#f9b96e" stroke="#e59a3e" stroke-width="2"/>
        <path d="M502,136 C534,130 578,138 620,158 C621,162 620,166 616,168 C576,154 534,148 504,150 Z"
              fill="#f6a623" stroke="#d9860f" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <g id="wing">
        <path d="M410,240 C440,236 478,250 516,268 C544,282 562,294 570,302 C562,310 538,308 506,296 C468,282 428,266 404,254 C398,250 400,244 410,240 Z"
              fill="#f4f5ee" stroke="#cfd4cc" stroke-width="3" stroke-linejoin="round"/>
        <path d="M468,278 Q502,290 542,300" stroke="#dfe2d8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 近侧腿 -->
    <g>
      <line id="nearCrank" x1="450" y1="478" x2="450" y2="528" stroke="#4a4f57" stroke-width="8" stroke-linecap="round"/>
      <rect id="nearPedal" x="434" y="523" width="30" height="9" rx="4" fill="#22262b"/>
      <path id="nearLegO" fill="none" stroke="#c76d12" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="nearLegF" fill="none" stroke="#f6a02c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="nearFoot" d="M -12 -6 C -4 -10 6 -9 14 -4 C 19 -1 18 4 12 5 L -10 5 C -18 5 -21 -2 -12 -6 Z"
            fill="#f6a02c" stroke="#c76d12" stroke-width="2.5"/>
    </g>

    <!-- 点击热区 + 气泡 -->
    <g id="hitPelican" style="cursor:pointer">
      <ellipse cx="385" cy="265" rx="85" ry="88" fill="transparent"/>
      <circle cx="490" cy="148" r="34" fill="transparent"/>
    </g>
    <g id="bubble">
      <path d="M648,248 L640,268 L668,248 Z" fill="#fff" stroke="#e63946" stroke-width="3" stroke-linejoin="round"/>
      <rect x="596" y="196" width="170" height="52" rx="14" fill="#fff" stroke="#e63946" stroke-width="3"/>
      <text x="681" y="231" text-anchor="middle" font-size="24" font-weight="700" fill="#e63946" data-i18n="ring">叮铃铃~!</text>
    </g>

    <!-- 天气/光照叠加层 -->
    <rect id="tintSunset" class="tint" width="1000" height="640" fill="#ff9a3c" style="opacity:0"/>
    <rect id="tintNight" class="tint" width="1000" height="640" fill="#16255c" style="opacity:0"/>
    <rect id="tintRain" class="tint" width="1000" height="640" fill="#3a4a58" style="opacity:0"/>

    <!-- 夜晚特效：车灯光束 + 萤火虫 -->
    <g id="nightFx" class="fx" style="opacity:0">
      <ellipse cx="745" cy="541" rx="115" ry="12" fill="#fff2b0" opacity=".15"/>
      <path d="M614,376 L800,338 L800,448 L614,390 Z" fill="url(#gradBeam)" opacity=".5"/>
      <g id="fireflies" fill="#ffe66d">
        <circle r="2.6"/><circle r="2.2"/><circle r="2.6"/><circle r="2.2"/><circle r="2.4"/><circle r="2.6"/>
      </g>
    </g>

    <!-- 雨特效 -->
    <g id="rainFx" class="fx" style="opacity:0"></g>
  </svg>

  <div class="controls">
    <button id="pauseBtn" class="fit" data-i18n="pause">⏸ 暂停</button>
    <label>🐢 <input id="speed" type="range" min="0" max="2" step="0.05" value="1"> 🐇</label>
    <span id="speedVal">×1.00</span>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const $all=s=>Array.from(document.querySelectorAll(s));
  let T0=0;
  try{const q=new URLSearchParams(location.search).get('t');if(q)T0=parseFloat(q)||0;}catch(e){}

  let t=T0,last=performance.now(),running=true,mul=1,boost=1,scene='day';
  const BB={x:450,y:478},CR=50,V=220,WHEEL=70;

  const spokesR=$('spokesR'),spokesF=$('spokesF'),chainT=$('chainTop'),chainB=$('chainBot'),road=$('roadDash');
  const pelican=$('pelican'),headG=$('headG'),wing=$('wing'),bubble=$('bubble');
  const legs={
    far:{o:$('farLegO'),f:$('farLegF'),foot:$('farFoot'),crank:$('farCrank'),pedal:$('farPedal'),
         L1:95,L2:135,hip:{x:394,y:310}},
    near:{o:$('nearLegO'),f:$('nearLegF'),foot:$('nearFoot'),crank:$('nearCrank'),pedal:$('nearPedal'),
          L1:95,L2:135,hip:{x:408,y:316}}
  };
  const scs=$all('.sc').map(g=>({g,x0:+g.dataset.x0,y:+g.dataset.y,sp:+g.dataset.sp}));
  const fls=$all('.fl').map(g=>({g,x0:+g.dataset.x0,y:+g.dataset.y,sp:+g.dataset.sp}));
  const clouds=$all('.cloud').map(g=>({g,x0:+g.dataset.x0,y:+g.dataset.y,sp:+g.dataset.sp}));
  const waves=[$('wave1'),$('wave2'),$('wave3')];

  // ── 场景切换 ──
  const sceneEls={day:$('scn-day'),sunset:$('scn-sunset'),night:$('scn-night'),sea:$('scn-sea'),rain:$('scn-rain')};
  const tints={sunset:$('tintSunset'),night:$('tintNight'),rain:$('tintRain')};
  const fx={night:$('nightFx'),rain:$('rainFx')};
  const CFG={day:{},sunset:{tint:['sunset',.10]},night:{tint:['night',.30],fx:'night'},
             sea:{},rain:{tint:['rain',.15],fx:'rain'}};
  const ORDER=['day','sunset','night','sea','rain'];

  function switchScene(name){
    scene=name;
    for(const k in sceneEls)sceneEls[k].classList.toggle('active',k===name);
    for(const k in tints)tints[k].style.opacity=0;
    for(const k in fx)fx[k].style.opacity=0;
    const c=CFG[name];
    if(c.tint){tints[c.tint[0]].style.opacity=c.tint[1];
      if(c.fx)fx[c.fx].style.opacity=1;}
    $all('#sceneBar button[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===name));
    document.body.dataset.theme=name;
    $all('.bg').forEach(b=>b.classList.toggle('on',b.dataset.for===name));
  }
  $all('#sceneBar button[data-scene]').forEach(b=>b.addEventListener('click',()=>switchScene(b.dataset.scene)));
  try{const q=new URLSearchParams(location.search).get('scene');if(q&&sceneEls[q])switchScene(q);}catch(e){}
  document.addEventListener('keydown',e=>{
    const i=+e.key-1;
    if(i>=0&&i<ORDER.length)switchScene(ORDER[i]);
  });
  // ── 中英双语 ──
  const I18N={
    zh:{title:'鹈鹕骑行记',tagline:'Pelican Ride · 纯 SVG 多场景',sub:'一只鹈鹕，一辆自行车，五个场景 —— 数字键 1-5 快速切换。',
        'sc-day':'晴日','sc-sunset':'黄昏','sc-night':'星夜','sc-sea':'海滨','sc-rain':'细雨',
        pause:'⏸ 暂停',resume:'▶ 继续',
        ring:'叮铃铃~!',
        aria:'一只戴头盔的鹈鹕骑着红色自行车，可在五种场景间切换'},
    en:{title:'Pelican Ride',tagline:'Pure SVG · 5 Scenes',sub:'One pelican, one bicycle, five scenes — press keys 1-5 to switch.',
        'sc-day':'Day','sc-sunset':'Sunset','sc-night':'Starry Night','sc-sea':'Seaside','sc-rain':'Drizzle',
        pause:'⏸ Pause',resume:'▶ Resume',
        ring:'Ring ring~!',
        aria:'A helmeted pelican riding a red bicycle across five switchable scenes'}
  };
  let lang='zh';
  // 语言切换时把 .fit 元素的宽度从旧值补间到新值，避免文案长短不一导致布局跳动
  function fitWidth(el){
    if(el._fitT){clearTimeout(el._fitT);el._fitT=null;}
    const w0=el.getBoundingClientRect().width;
    if(!w0)return;
    el.style.width='auto';
    const w1=el.getBoundingClientRect().width;
    if(Math.abs(w1-w0)<0.5){el.style.width='';return;}
    el.style.width=w0+'px';
    void el.offsetWidth;
    el.style.width=w1+'px';
    el._fitT=setTimeout(()=>{el.style.width='';el._fitT=null;},400);
  }
  function applyLang(){
    const d=I18N[lang];
    document.documentElement.lang=lang==='zh'?'zh-CN':'en';
    $all('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(d[k]!=null)el.textContent=d[k];});
    $('sceneSvg').setAttribute('aria-label',d.aria);
    $('pauseBtn').textContent=running?d.pause:d.resume;
    $('langBtn').textContent=lang==='zh'?'EN':'中文';
    $all('.fit').forEach(fitWidth);
  }
  $('langBtn').addEventListener('click',()=>{
    lang=lang==='zh'?'en':'zh';
    try{localStorage.setItem('pelican-ride-lang',lang);}catch(e){}
    applyLang();
  });
  try{
    const ql=new URLSearchParams(location.search).get('lang');
    const sl=localStorage.getItem('pelican-ride-lang');
    if(ql==='en'||ql==='zh')lang=ql;else if(sl==='en'||sl==='zh')lang=sl;
  }catch(e){}
  applyLang();

  // ── 雨滴（JS 生成）──
  const rainG=$('rainFx'),drops=[];
  for(let i=0;i<34;i++){
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('stroke','#dfeaf3');l.setAttribute('stroke-width','2');
    l.setAttribute('stroke-linecap','round');l.setAttribute('opacity','.55');
    rainG.appendChild(l);
    drops.push({el:l,x:Math.random()*1080-40,y:Math.random()*660,sp:380+Math.random()*220,len:14+Math.random()*12});
  }

  // ── 萤火虫 ──
  const fliesEls=$all('#fireflies circle');
  const flies=[{bx:160,by:570,f1:.9,f2:1.3,f3:1.6,p:0},{bx:320,by:600,f1:.7,f2:1.1,f3:1.2,p:2},
               {bx:520,by:585,f1:1.1,f2:.8,f3:1.8,p:4},{bx:700,by:610,f1:.8,f2:1.2,f3:1.1,p:1},
               {bx:840,by:565,f1:1.2,f2:.9,f3:1.5,p:5},{bx:930,by:598,f1:.9,f2:1.4,f3:1.3,p:3}];

  const wrap=(x,w)=>((x%w)+w)%w;

  // 两段式反向运动学：髋 -> 膝 -> 踏板，膝盖向前弯
  function ik(H,P,L1,L2){
    let dx=P.x-H.x,dy=P.y-H.y,d=Math.hypot(dx,dy);
    d=Math.min(Math.max(d,Math.abs(L1-L2)+2),L1+L2-1);
    const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
    const ux=dx/d,uy=dy/d;
    return {x:H.x+ux*a+uy*h,y:H.y+uy*a-ux*h};
  }
  function setLeg(l,hip,ped){
    const k=ik(hip,ped,l.L1,l.L2);
    const d=`M ${hip.x.toFixed(1)} ${hip.y.toFixed(1)} L ${k.x.toFixed(1)} ${k.y.toFixed(1)} L ${ped.x.toFixed(1)} ${(ped.y-3).toFixed(1)}`;
    l.o.setAttribute('d',d);l.f.setAttribute('d',d);
    l.foot.setAttribute('transform',`translate(${(ped.x+3).toFixed(1)} ${(ped.y-8).toFixed(1)})`);
    l.crank.setAttribute('x2',ped.x.toFixed(1));l.crank.setAttribute('y2',ped.y.toFixed(1));
    l.pedal.setAttribute('x',(ped.x-16).toFixed(1));l.pedal.setAttribute('y',(ped.y-5).toFixed(1));
  }

  function render(dt){
    const wA=(t*V/WHEEL*180/Math.PI)%360;
    spokesR.setAttribute('transform',`rotate(${wA.toFixed(2)} 330 470)`);
    spokesF.setAttribute('transform',`rotate(${wA.toFixed(2)} 650 470)`);
    road.setAttribute('stroke-dashoffset',(t*V).toFixed(1));
    const off=(t*V*1.6).toFixed(1);
    chainT.setAttribute('stroke-dashoffset',off);
    chainB.setAttribute('stroke-dashoffset',(-off).toString());

    const ang=(t*150)%360*Math.PI/180;
    const p1={x:BB.x+CR*Math.cos(ang),y:BB.y+CR*Math.sin(ang)};
    const p2={x:BB.x-CR*Math.cos(ang),y:BB.y-CR*Math.sin(ang)};
    const bob=2.2*Math.sin(t*2*Math.PI*1.1);
    pelican.setAttribute('transform',`translate(0 ${bob.toFixed(2)})`);
    setLeg(legs.far,{x:legs.far.hip.x,y:legs.far.hip.y+bob},p2);
    setLeg(legs.near,{x:legs.near.hip.x,y:legs.near.hip.y+bob},p1);

    headG.setAttribute('transform',`rotate(${(2.4*Math.sin(t*5.6+1)).toFixed(2)} 480 152)`);
    wing.setAttribute('transform',`rotate(${(2.5*Math.sin(t*3.1)).toFixed(2)} 410 242)`);

    for(const c of clouds)c.g.setAttribute('transform',`translate(${(wrap(c.x0-t*c.sp,1300)-150).toFixed(1)} ${c.y})`);
    for(const s of scs)s.g.setAttribute('transform',`translate(${(wrap(s.x0-t*V*s.sp,1400)-200).toFixed(1)} ${s.y})`);
    for(const f of fls)f.g.setAttribute('transform',`translate(${(wrap(f.x0-t*V*f.sp,1400)-200).toFixed(1)} ${f.y})`);

    // 海浪漂移
    waves[0].setAttribute('stroke-dashoffset',(t*36).toFixed(1));
    waves[1].setAttribute('stroke-dashoffset',(t*30+200).toFixed(1));
    waves[2].setAttribute('stroke-dashoffset',(t*42+400).toFixed(1));

    // 萤火虫（星夜）
    for(let i=0;i<flies.length;i++){
      const f=flies[i];
      fliesEls[i].setAttribute('transform',`translate(${(f.bx+18*Math.sin(t*f.f1+f.p)).toFixed(1)} ${(f.by+10*Math.sin(t*f.f2+f.p*1.7)).toFixed(1)})`);
      fliesEls[i].setAttribute('opacity',(.25+.75*Math.pow(Math.sin(t*f.f3+f.p),2)).toFixed(2));
    }

    // 雨丝（细雨场景激活时）
    if(scene==='rain'&&dt>0){
      for(const d of drops){
        d.y+=d.sp*dt;d.x-=d.sp*dt*.18;
        if(d.y>660){d.y=-30;d.x=Math.random()*1080-40;}
        d.el.setAttribute('x1',(d.x+3).toFixed(1));d.el.setAttribute('y1',d.y.toFixed(1));
        d.el.setAttribute('x2',(d.x-2).toFixed(1));d.el.setAttribute('y2',(d.y+d.len).toFixed(1));
      }
    }
  }

  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    let eff=0;
    if(running){boost+=(1-boost)*Math.min(1,dt*2);eff=dt*mul*boost;t+=eff;}
    render(eff);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  $('pauseBtn').addEventListener('click',()=>{
    running=!running;$('pauseBtn').textContent=running?I18N[lang].pause:I18N[lang].resume;
  });
  $('speed').addEventListener('input',e=>{
    mul=+e.target.value;$('speedVal').textContent='×'+mul.toFixed(2);
  });
  $('hitPelican').addEventListener('click',()=>{
    boost=1.85;bubble.classList.add('show');
    clearTimeout(bubble._h);bubble._h=setTimeout(()=>bubble.classList.remove('show'),1300);
  });
})();
</script>
</body>
</html>
